<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="layer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>
    
    <!-- Highlights -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="680" rx="16" fill="url(#bg-gradient)"/>
  <rect x="2" y="2" width="956" height="676" rx="14" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Header Section -->
  <g transform="translate(40, 40)">
    <text x="0" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">Spatia Modular Robotics Architecture</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Six-layer system stack enabling unified cross-hardware perception and execution</text>
  </g>

  <!-- System Layers (Top to Bottom) -->
  <g transform="translate(40, 110)">
    
    <!-- Layer 6: Application & Task Logic -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="880" height="72" rx="8" fill="url(#layer-grad)" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="0" width="8" height="72" rx="4" fill="#38bdf8"/>
      <text x="28" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 6</text>
      <text x="28" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Application &amp; Task Planning</text>
      <text x="320" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">High-level state machines, task orchestrator, safety limits, user workflow logic</text>
    </g>

    <!-- Layer 5: Spatial Mapping & World State -->
    <g transform="translate(0, 84)" filter="url(#shadow)">
      <rect width="880" height="72" rx="8" fill="url(#layer-grad)" stroke="#0284c7" stroke-width="1"/>
      <rect x="0" y="0" width="8" height="72" rx="4" fill="#0284c7"/>
      <text x="28" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 5</text>
      <text x="28" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Spatial Mapping &amp; World Model</text>
      <text x="320" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Dynamic 3D scene graphs, persistent spatial memory, obstacle mesh updates</text>
    </g>

    <!-- Layer 4: Shared Perception Engine -->
    <g transform="translate(0, 168)" filter="url(#shadow)">
      <rect width="880" height="78" rx="8" fill="url(#layer-grad)" stroke="#10b981" stroke-width="2"/>
      <rect x="0" y="0" width="8" height="78" rx="4" fill="#10b981"/>
      <rect x="760" y="14" width="104" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
      <text x="812" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CORE ENGINE</text>
      <text x="28" y="34" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 4</text>
      <text x="28" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Cross-Platform Perception Layer</text>
      <text x="320" y="45" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Sensor fusion (RGB-D/LiDAR), object detection/pose estimation, embodied AI</text>
    </g>

    <!-- Layer 3: Motion Planning & Trajectory -->
    <g transform="translate(0, 254)" filter="url(#shadow)">
      <rect width="880" height="72" rx="8" fill="url(#layer-grad)" stroke="#6366f1" stroke-width="1"/>
      <rect x="0" y="0" width="8" height="72" rx="4" fill="#6366f1"/>
      <text x="28" y="32" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 3</text>
      <text x="28" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="600">Motion &amp; Path Planning</text>
      <text x="320" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Collision-free trajectory generation, IK solvers, path optimization</text>
    </g>

    <!-- Layer 2: Hardware Abstraction Layer (HAL) Split -->
    <g transform="translate(0, 338)">
      <text x="0" y="-8" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LAYER 2 &amp; 1: HARDWARE ABSTRACTION &amp; EXECUTION PATHS</text>
      
      <!-- UR Subsystem -->
      <g transform="translate(0, 0)" filter="url(#shadow)">
        <rect width="428" height="155" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
        <path d="M 0 8 Q 0 0 8 0 L 420 0 Q 428 0 428 8 L 428 28 L 0 28 Z" fill="#1d4ed8" fill-opacity="0.3"/>
        <text x="16" y="19" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Universal Robots Integration Path</text>
        
        <!-- Layer 2 Component -->
        <rect x="16" y="38" width="396" height="44" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="28" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">L2: RTDE Driver &amp; Controller Interface</text>
        <text x="28" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Position Streaming via TCP/IP Client (125Hz - 500Hz)</text>
        
        <!-- Layer 1 Component -->
        <rect x="16" y="92" width="396" height="48" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="28" y="111" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">L1: UR Arm Kinematics &amp; Actuators</text>
        <text x="28" y="127" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Standard joint motors, external force/torque sensor optional</text>
      </g>

      <!-- Flexiv Subsystem -->
      <g transform="translate(452, 0)" filter="url(#shadow)">
        <rect width="428" height="155" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <path d="M 0 8 Q 0 0 8 0 L 420 0 Q 428 0 428 8 L 428 28 L 0 28 Z" fill="#047857" fill-opacity="0.3"/>
        <text x="16" y="19" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Flexiv Adaptive Integration Path</text>

        <!-- Layer 2 Component -->
        <rect x="16" y="38" width="396" height="44" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="28" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">L2: RDK API &amp; Torque Controller</text>
        <text x="28" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Direct Joint Torque/Force Command Primitives (1kHz)</text>

        <!-- Layer 1 Component -->
        <rect x="16" y="92" width="396" height="48" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="28" y="111" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">L1: Flexiv Arm &amp; Whole-Body Sensing</text>
        <text x="28" y="127" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">7-DoF joint torque sensors with high compliance control</text>
      </g>
    </g>
  </g>
</svg>
