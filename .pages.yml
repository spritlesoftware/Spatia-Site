media: media

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, blogType, date, readTime]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: category
        label: Category
        type: string
        required: true
        description: "Display label shown on the card (e.g. Shared Ideas, Behind the Work, Deep Dive, Industry)"

      - name: blogType
        label: Section
        type: select
        required: true
        default: tech
        description: "Which H2R section this post appears under"
        options:
          values:
            - { value: tech, label: Tech Blogs }
            - { value: business, label: Business Blogs }

      - name: readTime
        label: Read Time
        type: string
        required: true
        description: "e.g. 5 min read"

      - name: image
        label: Hero Image URL
        type: string
        required: true
        description: "External URL (Unsplash) or path to uploaded media"

      - name: imageAlt
        label: Image Alt Text
        type: string
        required: true

      - name: date
        label: Publication Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: featured
        label: Featured
        type: boolean
        description: "Show this post in the Featured Stories section on H2R"

      - name: seoTitle
        label: SEO Title
        type: string
        required: true
        description: "Title used for the browser tab & search results (aim for 50–60 characters)"

      - name: seoDescription
        label: SEO Description
        type: text
        required: true
        description: "Meta description shown in search results (aim for 140–160 characters)"

      - name: keywords
        label: SEO Keywords
        type: string
        description: "Comma-separated keywords (optional), e.g. spatial AI, robotics, perception"

      - name: body
        label: Body
        type: rich-text

settings:
  content:
    merge: true
